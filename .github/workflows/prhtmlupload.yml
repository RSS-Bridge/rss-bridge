name: 'PR Results'

on:
  workflow_run:
    workflows: ['PR Testing']
    types: [completed]

permissions:
  actions: read

jobs:
  # Github is stupid and doesn't provide the PR number in workflow_run contexts from forked repositories
  # Workaround from https://github.com/orgs/community/discussions/25220#discussioncomment-11316244
  get-pr-number:
    name: Get PR number
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      pr-number: ${{ steps.pr-context.outputs.number }}
    steps:
      - name: 'Get PR context'
        id: pr-context
        env:
          # Token required for GH CLI:
          GH_TOKEN: ${{ github.token }}
          # Best practice for scripts is to reference via ENV at runtime. Avoid using the expression syntax in the script content directly:
          PR_TARGET_REPO: ${{ github.repository }}
          # If the PR is from a fork, prefix it with `<owner-login>:`, otherwise only the PR branch name is relevant:
          PR_BRANCH: |-
            ${{
              (github.event.workflow_run.head_repository.owner.login != github.event.workflow_run.repository.owner.login)
                && format('{0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch)
                || github.event.workflow_run.head_branch
            }}
        # Query the PR number by repo + branch, then assign to step output:
        run: |
          gh pr view --repo "${PR_TARGET_REPO}" "${PR_BRANCH}" \
             --json 'number' --jq '"number=\(.number)"' \
             >> "${GITHUB_OUTPUT}"

  comment-pr:
    name: Create or update PR comment
    runs-on: ubuntu-slim
    needs: get-pr-number
    permissions:
      pull-requests: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Get comment length
        id: check
        run: |
          echo "comment_length=$(wc -c < comment.md)" >> $GITHUB_OUTPUT
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ needs.get-pr-number.outputs.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: Pull request artifacts
      - name: Create or update comment
        if: steps.check.outputs.comment_length > 130 || steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ needs.get-pr-number.outputs.pr-number }}
          body-file: comment.md
          edit-mode: replace

  upload-test-results:
    name: Upload to GitHub Pages repository
    runs-on: ubuntu-slim
    needs: get-pr-number
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: "${{ github.repository_owner }}/${{ vars.ARTIFACTS_REPO || 'rss-bridge-tests' }}"
          ref: 'main'
          ssh-key:  ${{ secrets.RSSTESTER_SSH_KEY }}
      - name: Setup git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "<>"
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Move test results
        run: |
          DIRECTORY="$GITHUB_WORKSPACE/prs/${{ needs.get-pr-number.outputs.pr-number }}"
          rm -rf $DIRECTORY
          mkdir -p $DIRECTORY
          cd $DIRECTORY
          mv -f $GITHUB_WORKSPACE/comment.md ./README.md
          mv -f $GITHUB_WORKSPACE/*.html .
      - name: Commit and push test results
        run: |
          export COMMIT_MESSAGE="Test results for PR ${{ needs.get-pr-number.outputs.pr-number }}"
          git add .
          git commit -m "$COMMIT_MESSAGE" || exit 0
          git push
