name: 'PR Testing'

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test-pr:
    name: Generate HTML files
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Create configuration files
        id: configuration
        run: |
          touch DEBUG
          PR=${{ github.event.number || 'none' }}
          wget https://patch-diff.githubusercontent.com/raw/$GITHUB_REPOSITORY/pull/$PR.patch
          grep "\bbridges/[A-Za-z0-9]*Bridge\.php\b" $PR.patch | sed "s=.*\bbridges/\([A-Za-z0-9]*\)Bridge\.php\b.*=\1=g" | sort -u > whitelist.txt
          echo "number_bridges=$(wc -l < whitelist.txt)" >> $GITHUB_OUTPUT
          echo "whitelist.txt:"
          cat whitelist.txt

      - name: Checkout - PR
        if: steps.configuration.outputs.number_bridges > 0
        uses: actions/checkout@v5
        with:
          path: pr
      - name: Build docker image - PR
        if: steps.configuration.outputs.number_bridges > 0
        run: docker build -t rss-bridge-pr pr/
      - name: Run docker container - PR
        if: steps.configuration.outputs.number_bridges > 0
        run: docker run -v $GITHUB_WORKSPACE/whitelist.txt:/app/whitelist.txt:ro -v $GITHUB_WORKSPACE/DEBUG:/app/DEBUG:ro --detach --pull never -p 3001:80 rss-bridge-pr

      - name: Checkout - Current
        if: steps.configuration.outputs.number_bridges > 0
        uses: actions/checkout@v5
        with:
          ref: ${{github.event.pull_request.base.ref}}
          repository: ${{github.event.pull_request.base.repo.full_name}}
          path: current
      - name: Build docker image - Current
        if: steps.configuration.outputs.number_bridges > 0
        run: docker build -t rss-bridge-current current/
      - name: Run docker container - Current
        if: steps.configuration.outputs.number_bridges > 0
        run: docker run -v $GITHUB_WORKSPACE/whitelist.txt:/app/whitelist.txt:ro -v $GITHUB_WORKSPACE/DEBUG:/app/DEBUG:ro --detach --pull never -p 3000:80 rss-bridge-current

      - name: Setup python
        if: steps.configuration.outputs.number_bridges > 0
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '**/*requirements*.txt'
      - name: Install python requirements
        if: steps.configuration.outputs.number_bridges > 0
        run: pip install -r ./current/.github/prtester-requirements.txt

      - name: Run bridge tests
        if: steps.configuration.outputs.number_bridges > 0
        id: run-tests
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python ./current/.github/prtester.py --artifacts-base-url "https://${{ github.repository_owner }}.github.io/${{ vars.ARTIFACTS_REPO || 'rss-bridge-tests' }}/prs/${{ github.event.number || 'none' }}"
          cat comment.md >> $GITHUB_STEP_SUMMARY
          echo "bodylength=$(wc -c < comment.md)" >> $GITHUB_OUTPUT

      - name: Upload test results as artifacts
        if: steps.configuration.outputs.number_bridges > 0 && steps.run-tests.outputs.bodylength > 130
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            comment.md
            *.html
          if-no-files-found: error
